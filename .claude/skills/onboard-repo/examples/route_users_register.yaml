# Example output of the repo-onboarding agent, scanning
# demo-user-registration-api (app/routes/users.py) for its
# `POST /api/v1/users/register` endpoint. Shown here as a reference for what
# a generated Route CRD should look like — the real one is created via the
# `deploy_fleet` MCP tool (not `create_route`, which has no fleet
# association mechanism), keyed off a fleet resolved during "Resolving the
# fleet" in SKILL.md. hostname/targetFleet below assume a fleet named
# "demo-user-api" with subdomain "demo-user-api.jpm.com" was created (or
# already existed) in the xCIB LOB — your actual values come from whatever
# fleet the developer picks or creates, not from this file.
apiVersion: ingress.jpmc.com/v1alpha1
kind: Route
metadata:
  name: users-register
  namespace: ingress-dp
  labels:
    app.kubernetes.io/managed-by: management-api
    ingress.jpmc.com/gateway: envoy
spec:
  path: "/api/v1/users/register"
  hostname: "demo-user-api.jpm.com"       # the resolved fleet's subdomain — not freely chosen
  targetFleet: "demo-user-api"            # the resolved fleet's name
  backendUrl: "http://host.docker.internal:8123"  # this worked example runs on the HOST (uvicorn),
                                           # not as its own container — see "backend_url" under Inputs
                                           # in SKILL.md. Don't copy this value for a different repo;
                                           # ask the developer what applies to theirs.
  gatewayType: envoy
  team: "platform"
  authnMechanism: "none"                  # public registration endpoint — no bearer token required.
                                           # NOTE: deploy_fleet always creates the route as "bearer";
                                           # this "none" only becomes real after a follow-up
                                           # update_route call — see Step 5 in SKILL.md.
  tlsRequired: true
  methods:
    - POST
  healthPath: "/health"
  payloadPolicyRef: "route_users_register"  # set by attach_payload_policy, not at route creation
  notes: >-
    Generated by the repo-onboarding agent from demo-user-registration-api's
    UserRegistration Pydantic model (full_name, email, phone, date_of_birth).
